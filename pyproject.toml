[project]
name = "th2etl"
version = "0.0.1"
description = "A flexible ETL framework with a database-driven scheduler, extensible pipeline blocs, and a RESTful API."
readme = "README.md"
authors = [
    { name = "thaink2", email = "contact@thaink2.com" }
]
requires-python = ">=3.10"
keywords = ["etl", "pipeline", "automation", "scheduler", "fastapi", "postgresql", "data-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: FastAPI",
]
dependencies = [
    "psycopg2-binary>=2.9.11",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pyjwt[crypto]>=2.8,<3.0",
    "python-jose>=3.5.0",
    "fastapi>=0.123.10",
    "uvicorn>=0.30.0",
    "passlib>=1.7.4",
    "pypdf>=4.0.0",
]

[project.scripts]
th2etl = "th2etl.runner:main"

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
]
postgres = [
    "sqlalchemy>=2.0",
    "pandas>=2.1.0",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
