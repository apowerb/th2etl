[project]
name = "th2etl"
version = "0.1.0"
description = "A flexible ETL framework with a database-driven scheduler, extensible pipeline blocs, and a RESTful API."
readme = "README.md"
authors = [
    { name = "thaink2", email = "contact@thaink2.com" }
]
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.0.0",
    "requests>=2.28,<3.0",
    "pyjwt[crypto]>=2.8,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "fastapi>=0.110,<0.111",
    "uvicorn[standard]>=0.28,<0.29",
    "passlib>=1.7.4",
]

[project.scripts]
th2etl = "th2etl.runner:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
